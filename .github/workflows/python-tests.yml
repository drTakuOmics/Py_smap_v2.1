name: python-tests

on:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install (CPU-only PyTorch keeps the runner small)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint (errors only)
        run: ruff check smap tests experiments tools --select F,E9
      - name: Tests
        run: pytest -q
